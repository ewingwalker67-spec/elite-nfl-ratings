 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL 17-0 Cheat Sheet</title>
<style>
body{margin:0;background:#090e17;color:white;font-family:Arial,sans-serif;padding:18px}
h1{color:#f2c45d}h2{margin-top:25px}
select,input,button{padding:12px;margin:5px 0;border-radius:8px;border:1px solid #35445b;background:#172438;color:white;width:100%;font-size:16px}
button{background:#f2c45d;color:#111;font-weight:bold;cursor:pointer}
.card{background:#111b2a;padding:14px;margin:10px 0;border-radius:12px}
.rating{color:#f2c45d;font-weight:bold;font-size:22px}
label{display:block;margin-top:10px;color:#bdc9d9}
</style>
</head>
<body>
<h1>🏈 NFL 17-0 Cheat Sheet</h1>
<p>Choose a team, era and lineup spot. Edit ratings whenever you want.</p>

<label>Team</label><select id="team"></select>
<label>Era</label>
<select id="era">
<option value="all">All eras</option>
<option>Pre-1995</option>
<option>1995-2010</option>
<option>2010-Present</option>
</select>
<label>Position</label>
<select id="pos">
<option value="all">All positions</option>
<option>QB</option><option>WR1</option><option>WR2</option>
<option>RB</option><option>TE</option>
<option>Lineman 1</option><option>Lineman 2</option><option>DB</option>
</select>
<label>Search player</label><input id="search" placeholder="Player name">
<h2>Player Rankings</h2>
<div id="players"></div>

<h2>Add or Edit Player</h2>
<input id="name" placeholder="Player name">
<label>Team</label><select id="editTeam"></select>
<label>Era</label>
<select id="editEra">
<option>Pre-1995</option><option>1995-2010</option><option>2010-Present</option>
</select>
<label>Lineup spot</label>
<select id="editPos">
<option>QB</option><option>WR1</option><option>WR2</option>
<option>RB</option><option>TE</option><option>Lineman 1</option>
<option>Lineman 2</option><option>DB</option>
</select>
<input id="year" type="number" placeholder="Year (optional)">
<input id="rating" type="number" min="0" max="99" placeholder="Rating from 0 to 99">
<button onclick="savePlayer()">Save Player</button>
<button onclick="exportData()">Export Backup</button>
<p>Ratings are estimates, not official ratings. Export a backup to keep your changes.</p>
